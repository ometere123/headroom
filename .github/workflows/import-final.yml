name: Import final HEADROOM source
# verified canonical archive chunks
on:
  push:
    paths:
      - ".github/workflows/import-final.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/headroom.part00 .bootstrap/headroom.part01 .bootstrap/headroom.part02 .bootstrap/headroom.part03 .bootstrap/headroom.part04 .bootstrap/headroom.part05 .bootstrap2/headroom.tail00 .bootstrap2/headroom.tail01a .bootstrap2/headroom.tail01b0 .bootstrap2/headroom.tail01b1a .bootstrap2/headroom.tail01b1b .bootstrap2/headroom.tail02 | base64 -d > /tmp/source.zip
          echo "213806fa06ac0aad140c0930f37e776fcbb52ab81b9658900275c0c941889a5b  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/import
          mkdir -p /tmp/import
          unzip -q /tmp/source.zip -d /tmp/import
          rsync -a --delete --exclude='.git/' /tmp/import/headroom-studionet/ ./
      - name: Commit exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete HEADROOM source"
          git push
